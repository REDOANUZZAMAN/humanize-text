services:
  ai-humanizer:
    build:
      context: .
      dockerfile: docker/Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./config:/app/config
      - ./src/methodologies/templates:/app/src/methodologies/templates
    environment:
      - CONFIG_PATH=/app/config/config.toml
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0) if urllib.request.urlopen('http://localhost:8000/health', timeout=5).status==200 else sys.exit(1)"]
      interval: 30s
      timeout: 8s
      retries: 3
      start_period: 15s
